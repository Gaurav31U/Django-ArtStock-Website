{% if page.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Pages">
  {% if page.has_previous %}<a class="btn btn-outline btn-sm" href="?{% if page_query %}{{ page_query }}&{% endif %}page={{ page.previous_page_number }}#gallery"><i class="fa-solid fa-arrow-left"></i> Previous</a>{% else %}<span></span>{% endif %}
  <span class="muted">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="btn btn-outline btn-sm" href="?{% if page_query %}{{ page_query }}&{% endif %}page={{ page.next_page_number }}#gallery">Next <i class="fa-solid fa-arrow-right"></i></a>{% else %}<span></span>{% endif %}
</nav>
{% endif %}
