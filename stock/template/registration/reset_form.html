{% extends 'registration/_shell.html' %}
{% block title %}Reset password{% endblock title %}
{% block card %}
<h1>Forgot your password?</h1>
<p class="muted">Enter the email on your account and we'll send you a link to choose a new one.</p>
<form method="post" style="margin-top:20px">
  {% csrf_token %}
  <div class="field{% if form.email.errors %} has-error{% endif %}">
    <label for="id_email">Email</label>
    <input type="email" name="email" id="id_email" class="input" autocomplete="email" required autofocus value="{{ form.email.value|default:'' }}">
    {{ form.email.errors }}
  </div>
  <button class="btn btn-primary btn-block btn-lg">Send reset link</button>
</form>
<p class="switch-role"><a href="{% url 'login_customer' %}">← Back to sign in</a></p>
{% endblock card %}
