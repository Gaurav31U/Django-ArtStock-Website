services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      - redis

  redis:
    build:
      context: ./Redis
      dockerfile: dockerfile
    ports:
      - "6379:6379"

  prometheus:
    build:
      context: ./Prometheus
      dockerfile: dockerfile
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana-oss
    ports:
      - "3000:3000"
    container_name: grafana

  loki:
    image: grafana/loki
    ports:
      - "3100:3100"
    container_name: loki
